<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colwork Yjs Tools</title>
  </head>
  <body class="viewer-page">
    <main class="viewer-shell">
      <section class="viewer-card">
        <div class="viewer-header">
          <div class="viewer-title-block">
            <p class="viewer-kicker">COLWORK / YJS TOOLS</p>
            <h1>快照重建与查看</h1>
            <p>拖拽文件或直接粘贴 JSON，重建最新数据后以只读方式查看。</p>
          </div>
          <div class="viewer-header-actions"><span class="viewer-mode">离线工具 · 不连接协作房间</span><button id="rebuild-button" class="viewer-action" type="button">重建最新快照</button></div>
        </div>
        <div class="viewer-input-grid">
          <label class="viewer-input-card"><span class="viewer-panel-heading"><strong><i>01</i>快照数据</strong><small>可选</small></span><textarea id="snapshot-input" placeholder="粘贴 colwork.snapshot.json 或 archive JSON"></textarea><span id="snapshot-drop" class="viewer-drop-zone">拖放快照文件到这里</span></label>
          <label class="viewer-input-card"><span class="viewer-panel-heading"><strong><i>02</i>Update Log</strong><small>可选</small></span><textarea id="updates-input" placeholder="粘贴 colwork.update-log.json 或 archive JSON"></textarea><span id="updates-drop" class="viewer-drop-zone">拖放 update log 文件到这里</span></label>
        </div>
        <div class="viewer-output-row"><span class="viewer-panel-heading"><strong><i>03</i>最新快照</strong><small>输出</small></span><textarea id="output-input" class="viewer-output" placeholder="重建结果会出现在这里，也可以手动粘贴快照"></textarea><div class="viewer-actions"><button id="show-button" class="viewer-action" type="button">展示只读表格</button><button id="download-button" class="viewer-action viewer-action--muted" type="button">下载快照</button></div></div>
        <p id="viewer-status" class="viewer-status">等待输入</p>
        <div id="table-root" class="viewer-table"></div>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
