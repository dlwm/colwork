<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/docs/brand/colwork-logo.png" />
    <title>Colwork · 快照工具</title>
  </head>
  <body class="viewer-page">
    <main class="viewer-shell">
      <nav class="viewer-nav" aria-label="页面导航"><a class="viewer-home" href="/" aria-label="Colwork · 返回首页"><img src="/docs/brand/colwork-logo.png" width="36" height="36" alt="" /><span>← 首页</span></a><a href="/test/vue.html">Vue 示例</a><a href="/test/react.html">React 示例</a></nav>
      <section aria-labelledby="viewer-title">
        <header class="viewer-header"><h1 id="viewer-title">快照工具</h1><span class="viewer-mode">离线读取，不连接协作房间</span></header>
        <p class="viewer-description">从快照和更新日志重建数据，也可以直接查看已有快照。</p>
        <div class="viewer-input-grid">
          <label class="viewer-input-card"><span class="viewer-panel-heading">快照 <small>可选</small></span><textarea spellcheck="false" id="snapshot-input" placeholder="粘贴 colwork.snapshot.json 或 archive JSON"></textarea><span id="snapshot-drop" class="viewer-drop-zone">拖入快照 JSON 文件</span></label>
          <label class="viewer-input-card"><span class="viewer-panel-heading">更新日志 <small>可选</small></span><textarea spellcheck="false" id="updates-input" placeholder="粘贴 colwork.update-log.json 或 archive JSON"></textarea><span id="updates-drop" class="viewer-drop-zone">拖入更新日志 JSON 文件</span></label>
        </div>
        <div class="viewer-actions"><button id="rebuild-button" class="viewer-action viewer-action--primary" type="button">重建快照</button></div>
        <div class="viewer-output-row"><label for="output-input" class="viewer-panel-heading">重建结果</label><textarea spellcheck="false" id="output-input" class="viewer-output" placeholder="重建后的快照，也可粘贴已有快照直接查看"></textarea><div class="viewer-actions"><button id="show-button" class="viewer-action" type="button">查看表格</button><button id="download-button" class="viewer-action" type="button">下载快照</button></div></div>
        <p id="viewer-status" class="viewer-status" role="status" aria-live="polite">等待输入</p>
        <div id="table-root" class="viewer-table"></div>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
